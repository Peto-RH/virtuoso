# Installed path: /etc/virtuoso/virtuoso.toml

[source]
type = "libvirt"
uri = "qemu:///system"

# VMware alternative: replace the active [source] above.
# [source]
# type = "vmware"
# uri = "https://vcenter.example.com/sdk"
# username = "virtuoso-reporter"
# ca_file = "/etc/virtuoso/vcenter-ca.pem" # Optional; replaces system trust.
# See README.md for vmware password setup

[destination]
# Organization ID from: subscription-manager identity
org_id = "your-org-id-here"

# Virtuoso builds the endpoint URL as https://{server}:{port}{prefix}.
server = "subscription.rhsm.redhat.com"
port = 443
# Required prefix starting with '/'.
prefix = "/subscription"
